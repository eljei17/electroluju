<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Electroluju | Electrodomésticos, hogar y decoración</title>
<meta name="description" content="Electroluju: electrodomésticos, artículos para el hogar y decoración en Barranquilla. Haz tu pedido por WhatsApp.">
<meta property="og:title" content="Electroluju">
<meta property="og:description" content="Electrodomésticos, hogar y decoración. Pide por WhatsApp.">
<meta property="og:image" content="logo.jpg">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: e-commerce — anuncio, cabecera fija con buscador y carrito, banner, beneficios, catálogo, pie; ficha y carrito en paneles */
:root{
  --bg:#fbf8f4; --surface:#ffffff; --soft:#f3ede4; --ink:#1f1c19; --muted:#6f665d; --line:#e8e0d5;
  --gold:#a8743a; --gold-dark:#8a5d2b; --on-gold:#ffffff; --sage:#6d7b63; --sale:#b23b2e; --ok:#2f7a4f;
  --shadow:0 1px 2px rgba(40,25,10,.05),0 6px 20px rgba(40,25,10,.06);
  --shadow-lg:0 20px 60px rgba(20,12,4,.25);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161412; --surface:#201d1a; --soft:#2a2622; --ink:#f3eee8; --muted:#b0a597; --line:#3a342d;
  --gold:#d4a46a; --gold-dark:#e4b97f; --on-gold:#1a1510; --sage:#a3b296; --sale:#ec7b6d; --ok:#6fc28f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --shadow-lg:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161412; --surface:#201d1a; --soft:#2a2622; --ink:#f3eee8; --muted:#b0a597; --line:#3a342d;
  --gold:#d4a46a; --gold-dark:#e4b97f; --on-gold:#1a1510; --sage:#a3b296; --sale:#ec7b6d; --ok:#6fc28f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --shadow-lg:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.h-display{font-family:var(--display);font-weight:800;letter-spacing:-.01em;line-height:1.08;text-wrap:balance;margin:0}


/* Header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:16px;padding-block:12px}
.brandlink{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.logo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.wordmark{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;line-height:1}
.wordmark span{color:var(--gold)}
.wordmark small{display:block;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.28em;color:var(--muted);margin-top:4px}
.searchbox{flex:1;min-width:0;position:relative}
.searchbox input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px 11px 40px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px;flex:none}
.iconbtn:hover{border-color:var(--gold)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-pressed="true"]{color:var(--ink);background:var(--soft)}

/* Admin bar */
.adminbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border:1px dashed var(--gold);border-radius:10px;background:var(--soft);font-size:14px}
.adminbar .grow{flex:1;min-width:180px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary:hover{background:var(--gold-dark);border-color:var(--gold-dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.btn.danger{color:var(--sale);border-color:var(--sale);background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;background:var(--soft);border-radius:18px;padding:40px;margin-top:20px;overflow:hidden}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(32px,4.6vw,54px);margin-block:10px 14px}
.hero p{color:var(--muted);max-width:44ch;margin:0 0 22px;font-size:16px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{justify-self:center;width:min(320px,100%);aspect-ratio:1/1;max-width:100%;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}

/* Benefits */
.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.benefit{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:600;font-size:14px}
.benefit i{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--gold);display:grid;place-items:center;flex:none;font-style:normal}

/* Catalog */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;margin-bottom:18px}
.section-head h2{font-size:clamp(26px,3vw,34px)}
.section-head .count{color:var(--muted);font-size:14px;margin-top:4px}
.sort{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--soft);position:relative;overflow:hidden;cursor:pointer;border:0;padding:0;display:block;width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s}
.ph img.alt{opacity:0}
.card:hover .ph img.alt{opacity:1}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.ph .none svg{color:var(--gold)}
.tags{position:absolute;top:10px;left:10px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--surface);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:6px}
.tag.sale{background:var(--sale);color:#fff}
.tag.out{background:var(--ink);color:var(--bg)}
.tag.ex{background:var(--soft);color:var(--muted)}
.card.sold .ph img{filter:grayscale(.6);opacity:.7}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
.name{font-size:16px;font-weight:700;line-height:1.3;margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.name:hover{color:var(--gold)}
.prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.was{font-size:14px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:8px;margin-top:10px}
.card-actions .btn{flex:1;padding:9px 10px}
.edit-row{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty h3{font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);margin:0 0 6px}

/* Footer */
footer{margin-top:64px;background:var(--surface);border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;padding-block:36px}
.foot h4{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px;color:var(--muted)}
.foot p,.foot li{margin:0;font-size:14px}
.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.foot .sel{user-select:all;font-weight:700;font-variant-numeric:tabular-nums}
.legal{border-top:1px solid var(--line);padding-block:16px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Panels */
.scrim{position:fixed;inset:0;background:rgba(15,10,5,.5);z-index:10;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.sheet{background:var(--surface);width:min(460px,100%);height:100%;overflow-y:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.modal{background:var(--surface);border-radius:18px;width:min(940px,100%);max-height:calc(100% - 16px);overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow-lg);position:relative}
.modal .x{position:absolute;top:12px;right:12px;z-index:2}
.gallery{background:var(--soft);display:flex;flex-direction:column;min-width:0}
.gallery .mainimg{aspect-ratio:1/1;max-width:100%;position:relative}
.gallery .mainimg img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{width:58px;height:58px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;flex:none;cursor:pointer;background:none}
.thumbs button[aria-current="true"]{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.detail{padding:28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.detail h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,32px);line-height:1.15;margin:0}
.detail .price{font-size:28px}
.detail .desc{color:var(--muted);margin:0;white-space:pre-line}
.stock{font-size:14px;font-weight:700}
.stock.on{color:var(--ok)} .stock.off{color:var(--sale)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:38px;height:40px;border:0;background:var(--surface);cursor:pointer;font-size:18px}
.qty span{min-width:36px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.buyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.buyrow .btn{flex:1;min-width:160px}

/* Cart */
.citem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.citem .thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--soft)}
.citem .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.citem .n{font-weight:700;font-size:14px;line-height:1.3}
.citem .p{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.citem .rm{border:0;background:none;color:var(--sale);font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-top:4px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:6px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--sale);margin:0;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--surface);color:var(--sale);cursor:pointer;font-size:14px;line-height:1}
.photo .main{position:absolute;bottom:4px;left:4px;font-size:10px;font-weight:800;background:var(--gold);color:var(--on-gold);padding:1px 6px;border-radius:999px}
.add-photo{aspect-ratio:1/1;border:1.5px dashed var(--gold);border-radius:8px;display:grid;place-items:center;color:var(--gold);cursor:pointer;font-size:13px;font-weight:700;text-align:center;padding:4px;background:none}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.confirm{border:1px solid var(--sale);border-radius:10px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:28px 22px}
  .hero-art{width:180px;grid-row:1}
  .modal{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr 1fr}
  .foot>div:first-child{grid-column:1/-1}
}
@media (max-width:600px){
  .head-row{flex-wrap:wrap;gap:10px}
  .searchbox{order:3;flex-basis:100%}
  .brandlink{flex:1;min-width:0}
  .wordmark{font-size:22px}
  .logo{width:44px;height:44px}
  .iconbtn .lbl{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .body{padding:10px 12px 12px}
  .name{font-size:14px}
  .price{font-size:17px}
  .card-actions .btn.wa{display:none}
  .detail{padding:20px}
  .foot{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.adminlink{background:none;border:0;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.loading{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
</style>
</head>

<header class="head">
  <div class="wrap">
    <div class="head-row">
      <a class="brandlink" href="#inicio" aria-label="Electroluju, inicio">
        <img class="logo" src="logo.jpg" alt="">
        <span class="wordmark">ELECTRO<span>LUJU</span><small>TODO PARA TU HOGAR</small></span>
      </a>
      <label class="searchbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="¿Qué estás buscando?" aria-label="Buscar productos"></label>
      <button class="iconbtn" id="cart-btn" aria-label="Abrir carrito"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="lbl">Carrito</span><span class="badge" id="cart-count">0</span></button>
    </div>
    <nav class="nav" id="nav" aria-label="Categorías"></nav>
  </div>
</header>
<main class="wrap" id="inicio">
  <div id="adminbar"></div>
  <section class="hero">
    <div>
      <span class="eyebrow">Hogar · Estilo · Calidad</span>
      <h1 class="h-display" id="hero-title">Todo lo que tu hogar necesita, con estilo</h1>
      <p id="hero-text"></p>
      <div class="hero-cta"><a class="btn primary" href="#catalogo">Ver productos</a><span id="hero-wa"></span></div>
    </div>
    <div class="hero-art"><img src="logo.jpg" alt="Logo de Electroluju"></div>
  </section>
  <section class="benefits" id="benefits" aria-label="Beneficios"></section>
  <section id="catalogo">
    <div class="section-head">
      <div><h2 class="h-display" id="cat-title">Nuestros productos</h2><div class="count" id="count"></div></div>

        <option value="new">Más recientes</option>

      </select>

    <div class="grid" id="grid"><div class="loading">Cargando productos…</div></div>
  </section>
</main>
<footer>
  <div class="wrap">
    <div class="foot">
      <div><span class="wordmark">ELECTRO<span>LUJU</span></span><p style="margin-top:12px;color:var(--muted);max-width:36ch" id="foot-about"></p></div>
      <div><h4>Contacto</h4><ul id="foot-contact"></ul></div>
      <div><h4>Categorías</h4><ul id="foot-cats"></ul></div>
    </div>
    <div class="legal"><span id="copy"></span><span>Precios en pesos colombianos (COP), IVA incluido. · <button class="adminlink" id="admin-link">Administrador</button></span></div>
  </div>
</footer>
<div id="panel-host"></div>

  try { cart = JSON.parse(localStorage.getItem('el-cart')||'[]') || []; } catch(e){ cart=[]; }
  var money = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
  var IMG_ICON = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-8 8"/></svg>';
  var ICONS = ['✦','◆','✓','★','♥','●'];

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},3200); }
  function byId(id){ return state.products.find(function(p){return p.id===id;}); }
  function pct(p){ return p.old_price && p.old_price>p.price ? Math.round((1-p.price/p.old_price)*100) : 0; }
  function saveCart(){ try{ localStorage.setItem('el-cart',JSON.stringify(cart)); }catch(e){} $('cart-count').textContent=cart.reduce(function(a,c){return a+c.qty;},0); }
  function categories(){ var set=[]; state.products.forEach(function(p){ if(p.category && set.indexOf(p.category)<0) set.push(p.category); }); return set.sort(); }
  function waNumber(){ var n=(S.whatsapp||'').replace(/\D/g,''); if(n.length===10) n='57'+n; return n; }
  function waUrl(text){ var n=waNumber(); return n ? 'https://wa.me/'+n+'?text='+encodeURIComponent(text) : ''; }

  /* ---------- Datos ---------- */
  async function load(){
    var r1 = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    var r2 = await sb.from('products').select('*').order('created_at',{ascending:false});
    if(r1.error || r2.error){
      $('grid').innerHTML='<div class="empty"><h3>No se pudo cargar la tienda</h3><p>Revisa tu conexión e intenta de nuevo.</p></div>';
      console.error(r1.error||r2.error); return;
    }
    Object.keys(S).forEach(function(k){ delete S[k]; });
    Object.assign(S, r1.data||{});
    state.products = (r2.data||[]).map(function(p){ p.photos=p.photos||[]; return p; });
    renderAll();
  }

  /* ---------- Render ---------- */
  function renderStatic(){
    if(S.hero_title) $('hero-title').textContent=S.hero_title;
    $('hero-text').textContent=S.hero_text||'';
    var w=waUrl('Hola Electroluju, quiero información sobre sus productos.');
    $('hero-wa').innerHTML=w?'<a class="btn" href="'+esc(w)+'" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>':'';
    var bl=(S.benefits||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
    $('benefits').innerHTML=bl.map(function(b,i){return '<div class="benefit"><i>'+ICONS[i%ICONS.length]+'</i><span>'+esc(b)+'</span></div>';}).join('');
    $('benefits').hidden=!bl.length;
    $('foot-about').textContent=S.about||'';
    var c=[], ig=(S.instagram||'').replace(/^@/,'');
    if(S.whatsapp) c.push('<li>WhatsApp: <span class="sel">'+esc(S.whatsapp)+'</span></li>');
    if(ig) c.push('<li>Instagram: <a href="https://instagram.com/'+esc(ig)+'" target="_blank" rel="noopener">@'+esc(ig)+'</a></li>');
    if(S.city) c.push('<li>'+esc(S.city)+'</li>');
    $('foot-contact').innerHTML=c.join('')||'<li style="color:var(--muted)">Pronto publicaremos nuestros datos de contacto.</li>';
    $('copy').textContent='© '+new Date().getFullYear()+' Electroluju. Todos los derechos reservados.';
  }

  function renderNav(){
    var cats=categories(); if(ui.cat!=='Todos' && cats.indexOf(ui.cat)<0) ui.cat='Todos';
    $('nav').innerHTML=['Todos'].concat(cats).map(function(c){return '<button aria-pressed="'+(c===ui.cat)+'" data-cat="'+esc(c)+'">'+esc(c==='Todos'?'Todos los productos':c)+'</button>';}).join('');
    $('nav').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ ui.cat=b.dataset.cat; renderNav(); renderGrid(); $('catalogo').scrollIntoView({behavior:'smooth',block:'start'}); }; });
    $('foot-cats').innerHTML=cats.map(function(c){return '<li><a href="#catalogo" data-fc="'+esc(c)+'">'+esc(c)+'</a></li>';}).join('');
    $('foot-cats').querySelectorAll('[data-fc]').forEach(function(a){ a.onclick=function(){ ui.cat=a.dataset.fc; renderNav(); renderGrid(); }; });
  }

  function renderAdminBar(){
    var host=$('adminbar');
    if(!ui.user){ host.innerHTML=''; return; }
    if(!ui.admin){
      host.innerHTML='<div class="adminbar"><span class="grow">Sesión de administrador iniciada.</span><button class="btn small" id="a-on">Administrar tienda</button><button class="btn small" id="a-out">Cerrar sesión</button></div>';
      $('a-on').onclick=function(){ ui.admin=true; renderAll(); };
    } else {
      host.innerHTML='<div class="adminbar"><span class="grow"><strong>Modo administrador.</strong> Tus clientes no ven estos controles.</span>'+
        '<button class="btn small" id="a-set">Ajustes de la tienda</button><button class="btn small primary" id="a-new">+ Agregar producto</button><button class="btn small" id="a-off">Ver como cliente</button><button class="btn small" id="a-out">Cerrar sesión</button></div>';
      $('a-new').onclick=function(){ openEditor(null); };
      $('a-set').onclick=openSettings;
      $('a-off').onclick=function(){ ui.admin=false; renderAll(); };
    }
    $('a-out').onclick=async function(){ await sb.auth.signOut(); ui.user=null; ui.admin=false; renderAll(); toast('Sesión cerrada'); };
  }

  function filtered(){
    var q=ui.q.trim().toLowerCase();
    var list=state.products.filter(function(p){
      if(ui.cat!=='Todos' && p.category!==ui.cat) return false;
      if(q && (p.name+' '+(p.description||'')+' '+p.category).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    list.sort(function(a,b){
      if(a.available!==b.available) return a.available?-1:1;
      if(ui.sort==='low') return a.price-b.price;
      if(ui.sort==='high') return b.price-a.price;
      if(ui.sort==='az') return a.name.localeCompare(b.name,'es');
      return new Date(b.created_at)-new Date(a.created_at);
    });
    return list;
  }

  function priceHtml(p){ return '<div class="prices"><span class="price">'+money.format(p.price)+'</span>'+(pct(p)?'<span class="was">'+money.format(p.old_price)+'</span>':'')+'</div>'; }

  function renderGrid(){
    var list=filtered(), g=$('grid');
    $('cat-title').textContent=ui.cat==='Todos'?'Nuestros productos':ui.cat;
    $('count').textContent=list.length+(list.length===1?' producto':' productos');
    if(!state.products.length){ g.innerHTML='<div class="empty"><h3>Muy pronto, nuevos productos</h3><p>'+(ui.user?'Entra a “Administrar tienda” y agrega el primero.':'Estamos preparando el catálogo.')+'</p></div>'; return; }
    if(!list.length){ g.innerHTML='<div class="empty"><h3>No encontramos resultados</h3><p>Prueba con otra palabra o categoría.</p></div>'; return; }
    g.innerHTML=list.map(function(p){
      var img=p.photos.length?'<img src="'+esc(p.photos[0])+'" alt="'+esc(p.name)+'" loading="lazy">'+(p.photos[1]?'<img class="alt" src="'+esc(p.photos[1])+'" alt="" loading="lazy">':''):'<span class="none">'+IMG_ICON+'Foto próximamente</span>';
      var tags=[];
      if(!p.available) tags.push('<span class="tag out">Agotado</span>'); else if(pct(p)) tags.push('<span class="tag sale">-'+pct(p)+'%</span>');
      var w=waUrl('Hola Electroluju, me interesa: '+p.name+' ('+money.format(p.price)+')');
      var actions=p.available?'<div class="card-actions"><button class="btn dark" data-add="'+p.id+'">Agregar</button>'+(w?'<a class="btn wa" href="'+esc(w)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div>':'<div class="card-actions"><button class="btn" disabled>Agotado</button></div>';
      var edit=ui.admin?'<div class="edit-row"><button class="btn small" data-edit="'+p.id+'">Editar</button><button class="btn small danger" data-del="'+p.id+'">Eliminar</button></div>':'';
      return '<article class="card'+(p.available?'':' sold')+'"><div class="tags">'+tags.join('')+'</div>'+
        '<button class="ph" data-open="'+p.id+'" aria-label="Ver '+esc(p.name)+'">'+img+'</button>'+
        '<div class="body"><span class="cat">'+esc(p.category)+'</span><button class="name" data-open="'+p.id+'">'+esc(p.name)+'</button>'+
        priceHtml(p)+actions+edit+'</div></article>';
    }).join('');
    g.querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(){ openProduct(b.dataset.open); }; });
    g.querySelectorAll('[data-add]').forEach(function(b){ b.onclick=function(){ addToCart(b.dataset.add,1); }; });
    g.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ openEditor(b.dataset.edit); }; });
    g.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ openEditor(b.dataset.del,true); }; });
  }

  function renderAll(){ renderStatic(); renderAdminBar(); renderNav(); renderGrid(); saveCart(); }

  /* ---------- Paneles ---------- */
  function closePanel(){ $('panel-host').innerHTML=''; document.body.style.overflow=''; }
  function panel(html,center){
    $('panel-host').innerHTML='<div class="scrim'+(center?' center':'')+'" id="scrim">'+html+'</div>';
    document.body.style.overflow='hidden';
    $('scrim').onclick=function(e){ if(e.target.id==='scrim') closePanel(); };
    $('panel-host').querySelectorAll('[data-close]').forEach(function(b){ b.onclick=closePanel; });
  }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && $('scrim')) closePanel(); });

  function openProduct(id){
    var p=byId(id); if(!p) return; var idx=0, qty=1;
    function draw(){
      var main=p.photos.length?'<img src="'+esc(p.photos[idx])+'" alt="'+esc(p.name)+'">':'<span class="none" style="position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-weight:600">'+IMG_ICON+'Foto próximamente</span>';
      var th=p.photos.length>1?'<div class="thumbs">'+p.photos.map(function(s,i){return '<button data-i="'+i+'" aria-current="'+(i===idx)+'" aria-label="Foto '+(i+1)+'"><img src="'+esc(s)+'" alt=""></button>';}).join('')+'</div>':'';
      var w=waUrl('Hola Electroluju, quiero comprar: '+qty+' x '+p.name+' ('+money.format(p.price*qty)+')');
      var ask=waUrl('Hola Electroluju, ¿cuándo vuelve a estar disponible '+p.name+'?');
      panel('<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(p.name)+'"><button class="x" data-close aria-label="Cerrar">×</button>'+
        '<div class="gallery"><div class="mainimg">'+main+'</div>'+th+'</div>'+
        '<div class="detail"><span class="cat">'+esc(p.category)+'</span><h2>'+esc(p.name)+'</h2>'+priceHtml(p)+
        (pct(p)?'<span class="stock on">Ahorras '+money.format(p.old_price-p.price)+'</span>':'')+
        '<span class="stock '+(p.available?'on':'off')+'">'+(p.available?'● Disponible':'● Agotado por ahora')+'</span>'+
        (p.description?'<p class="desc">'+esc(p.description)+'</p>':'')+
        (p.available?'<div class="buyrow"><div class="qty"><button id="m-minus" aria-label="Menos">−</button><span>'+qty+'</span><button id="m-plus" aria-label="Más">+</button></div><button class="btn dark" id="m-add">Agregar al carrito</button></div>'+
          (w?'<a class="btn wa block" href="'+esc(w)+'" target="_blank" rel="noopener">Comprar por WhatsApp</a>':''):
          (ask?'<a class="btn block" href="'+esc(ask)+'" target="_blank" rel="noopener">Preguntar cuándo llega</a>':''))+
        '</div></div>',true);
      $('panel-host').querySelectorAll('[data-i]').forEach(function(b){ b.onclick=function(){ idx=+b.dataset.i; draw(); }; });
      if(p.available){
        $('m-minus').onclick=function(){ if(qty>1){qty--; draw();} };
        $('m-plus').onclick=function(){ if(qty<99){qty++; draw();} };
        $('m-add').onclick=function(){ addToCart(p.id,qty); closePanel(); };
      }
    }
    draw();
  }

  function addToCart(id,n){
    var it=cart.find(function(c){return c.id===id;});
    if(it) it.qty=Math.min(99,it.qty+n); else cart.push({id:id,qty:n});
    saveCart(); toast('Agregado al carrito');
  }

  function openCart(){
    cart=cart.filter(function(c){ var p=byId(c.id); return p && p.available; });
    var items=cart.map(function(c){ return {p:byId(c.id),qty:c.qty}; });
    var total=items.reduce(function(a,i){return a+i.p.price*i.qty;},0), body;
    if(!items.length) body='<p class="note" style="padding-block:24px;text-align:center">Tu carrito está vacío.</p><button class="btn block" data-close>Seguir comprando</button>';
    else {
      var lines=items.map(function(i){return '• '+i.qty+' x '+i.p.name+' — '+money.format(i.p.price*i.qty);}).join('\n');
      var w=waUrl('Hola Electroluju, quiero hacer este pedido:\n'+lines+'\nTotal: '+money.format(total));
      body='<div>'+items.map(function(i){
        return '<div class="citem"><div class="thumb">'+(i.p.photos[0]?'<img src="'+esc(i.p.photos[0])+'" alt="">':'')+'</div>'+
          '<div><div class="n">'+esc(i.p.name)+'</div><div class="p">'+money.format(i.p.price)+'</div><button class="rm" data-rm="'+i.p.id+'">Quitar</button></div>'+
          '<div class="qty"><button data-dec="'+i.p.id+'" aria-label="Menos">−</button><span>'+i.qty+'</span><button data-inc="'+i.p.id+'" aria-label="Más">+</button></div></div>';
      }).join('')+'</div><div class="total"><span>Total</span><span>'+money.format(total)+'</span></div>'+
      '<p class="note">El envío y el pago se coordinan directamente con la tienda por WhatsApp.</p>'+
      (w?'<a class="btn wa block" href="'+esc(w)+'" target="_blank" rel="noopener">Finalizar pedido por WhatsApp</a>':'<p class="err">La tienda aún no ha configurado su número de WhatsApp.</p>')+
      '<button class="btn block" data-close>Seguir comprando</button>';
    }
    panel('<div class="sheet" role="dialog" aria-modal="true" aria-label="Carrito"><div class="sheet-head"><h2>Tu carrito</h2><button class="x" data-close aria-label="Cerrar">×</button></div>'+body+'</div>');
    var host=$('panel-host');
    host.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick=function(){ cart=cart.filter(function(c){return c.id!==b.dataset.rm;}); saveCart(); openCart(); }; });
    host.querySelectorAll('[data-inc]').forEach(function(b){ b.onclick=function(){ var c=cart.find(function(x){return x.id===b.dataset.inc;}); if(c.qty<99) c.qty++; saveCart(); openCart(); }; });
    host.querySelectorAll('[data-dec]').forEach(function(b){ b.onclick=function(){ var c=cart.find(function(x){return x.id===b.dataset.dec;}); if(c.qty>1) c.qty--; else cart=cart.filter(function(x){return x!==c;}); saveCart(); openCart(); }; });
  }

  /* ---------- Admin: fotos ---------- */
  function resizeToBlob(file){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ var im=new Image(); im.onload=function(){
        var max=1200, s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        c.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/jpeg',0.82);
      }; im.onerror=rej; im.src=r.result; };
      r.onerror=rej; r.readAsDataURL(file);
    });
  }
  async function uploadPhoto(file){
    var blob=await resizeToBlob(file);
    var path=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.jpg';
    var up=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(up.error) throw up.error;
    return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  }
  function pathFromUrl(u){ var i=u.indexOf('/fotos/'); return i<0?null:decodeURIComponent(u.slice(i+7)); }
  async function removePhotos(urls){
    var paths=urls.map(pathFromUrl).filter(Boolean);
    if(paths.length) await sb.storage.from('fotos').remove(paths);
  }

  /* ---------- Admin: editor ---------- */
  function openEditor(id,askDelete){
    var p=id?byId(id):null;
    var draft=p?JSON.parse(JSON.stringify(p)):{name:'',price:0,old_price:0,category:'',description:'',photos:[],available:true};
    var original=p?p.photos.slice():[];
    var uploaded=[];
    panel('<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>'+(p?'Editar producto':'Nuevo producto')+'</h2><button class="x" id="f-x" aria-label="Cerrar">×</button></div>'+
      '<div class="field"><label>Fotos</label><div class="photos" id="ph"></div><p class="hint" id="ph-hint">La primera es la foto principal y la segunda aparece al pasar el cursor.</p><input type="file" id="f-files" accept="image/*" multiple hidden></div>'+
      '<div class="field"><label for="f-name">Nombre del producto</label><input id="f-name" maxlength="90" value="'+esc(draft.name)+'"></div>'+
      '<div class="two"><div class="field"><label for="f-price">Precio (COP)</label><input id="f-price" inputmode="numeric" value="'+(draft.price||'')+'" placeholder="189900"></div>'+
      '<div class="field"><label for="f-old">Precio antes (opcional)</label><input id="f-old" inputmode="numeric" value="'+(draft.old_price||'')+'" placeholder="Para mostrar descuento"></div></div>'+
      '<div class="field"><label for="f-cat">Categoría</label><input id="f-cat" list="f-cats" value="'+esc(draft.category)+'" placeholder="Electrodomésticos"><datalist id="f-cats">'+categories().map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div>'+
      '<div class="field"><label for="f-desc">Descripción</label><textarea id="f-desc" maxlength="600">'+esc(draft.description)+'</textarea></div>'+
      '<label class="check"><input type="checkbox" id="f-av" '+(draft.available?'checked':'')+'> Disponible para la venta</label>'+
      '<div id="del-zone"></div><p class="err" id="f-err" role="alert"></p>'+
      '<div class="actions">'+(p?'<button class="btn danger" id="f-del">Eliminar</button>':'')+'<button class="btn" id="f-cancel">Cancelar</button><button class="btn primary" id="f-save">Guardar</button></div></div>');
    async function cancel(){ closePanel(); if(uploaded.length) await removePhotos(uploaded); }
    $('f-x').onclick=cancel; $('f-cancel').onclick=cancel;
    $('scrim').onclick=function(e){ if(e.target.id==='scrim') cancel(); };
    function drawPhotos(){
      $('ph').innerHTML=draft.photos.map(function(src,i){return '<div class="photo"><img src="'+esc(src)+'" alt="Foto '+(i+1)+'"><button data-rmp="'+i+'" aria-label="Quitar foto">×</button>'+(i===0?'<span class="main">Principal</span>':'')+'</div>';}).join('')+
        '<button type="button" class="add-photo" id="f-add">+ Agregar fotos</button>';
      $('ph').querySelectorAll('[data-rmp]').forEach(function(b){ b.onclick=function(){ draft.photos.splice(+b.dataset.rmp,1); drawPhotos(); }; });
      $('f-add').onclick=function(){ $('f-files').click(); };
    }
    drawPhotos();
    $('f-files').onchange=async function(e){
      var files=Array.prototype.slice.call(e.target.files); e.target.value='';
      $('f-save').disabled=true; $('ph-hint').textContent='Subiendo fotos…';
      for(var i=0;i<files.length;i++){
        try{ var url=await uploadPhoto(files[i]); uploaded.push(url); draft.photos.push(url); drawPhotos(); }
        catch(err){ console.error(err); toast('No se pudo subir una de las fotos.'); }
      }
      $('f-save').disabled=false; $('ph-hint').textContent='La primera es la foto principal y la segunda aparece al pasar el cursor.';
    };
    function showDelete(){
      $('del-zone').innerHTML='<div class="confirm">¿Eliminar “'+esc(draft.name||'este producto')+'”? Esta acción no se puede deshacer.<div class="actions"><button class="btn small" id="d-no">No, conservar</button><button class="btn small danger" id="d-yes">Sí, eliminar</button></div></div>';
      $('d-no').onclick=function(){ $('del-zone').innerHTML=''; };
      $('d-yes').onclick=async function(){
        this.disabled=true;
        var r=await sb.from('products').delete().eq('id',p.id);
        if(r.error){ $('f-err').textContent='No se pudo eliminar. Vuelve a iniciar sesión e intenta de nuevo.'; this.disabled=false; return; }
        await removePhotos(original.concat(uploaded));
        closePanel(); toast('Producto eliminado'); load();
      };
    }
    if(p) $('f-del').onclick=showDelete;
    if(askDelete) showDelete();
    $('f-save').onclick=async function(){
      var num=function(v){ return parseInt((v||'').replace(/\D/g,''),10)||0; };
      var row={
        name:$('f-name').value.trim(), price:num($('f-price').value), old_price:num($('f-old').value),
        category:$('f-cat').value.trim()||'General', description:$('f-desc').value.trim(),
        available:$('f-av').checked, photos:draft.photos
      };
      if(!row.name){ $('f-err').textContent='Escribe el nombre del producto.'; return; }
      if(!row.price){ $('f-err').textContent='Escribe el precio en pesos, solo números.'; return; }
      if(row.old_price && row.old_price<=row.price){ $('f-err').textContent='El precio antes debe ser mayor que el precio actual, o déjalo vacío.'; return; }
      this.disabled=true;
      var r=p?await sb.from('products').update(row).eq('id',p.id):await sb.from('products').insert(row);
      if(r.error){ console.error(r.error); $('f-err').textContent='No se pudo guardar. Vuelve a iniciar sesión e intenta de nuevo.'; this.disabled=false; return; }
      var dropped=original.filter(function(u){ return row.photos.indexOf(u)<0; });
      if(dropped.length) await removePhotos(dropped);
      closePanel(); toast('Producto guardado'); load();
    };
  }

  function openSettings(){
    function f(id,label,val,ph,ta,hint){ return '<div class="field"><label for="'+id+'">'+label+'</label>'+(ta?'<textarea id="'+id+'" placeholder="'+esc(ph)+'">'+esc(val)+'</textarea>':'<input id="'+id+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'">')+(hint?'<p class="hint">'+hint+'</p>':'')+'</div>'; }
    panel('<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>Ajustes de la tienda</h2><button class="x" data-close aria-label="Cerrar">×</button></div>'+
      f('s-wa','WhatsApp para pedidos',S.whatsapp,'300 123 4567',false,'Activa los botones de compra y el carrito.')+
      f('s-ig','Instagram',S.instagram,'@electroluju')+
      f('s-city','Ciudad',S.city,'Barranquilla, Colombia')+
      f('s-ht','Título principal',S.hero_title,'')+
      f('s-hx','Texto principal',S.hero_text,'',true)+
      f('s-ben','Beneficios (uno por línea)',S.benefits,'',true)+
      f('s-ab','Sobre la tienda (pie de página)',S.about,'',true)+
      '<p class="err" id="s-err" role="alert"></p>'+
      '<div class="actions"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="s-save">Guardar</button></div></div>');
    $('s-save').onclick=async function(){
      var row={ id:1, whatsapp:$('s-wa').value.trim(), instagram:$('s-ig').value.trim(), city:$('s-city').value.trim(),
        hero_title:$('s-ht').value.trim(), hero_text:$('s-hx').value.trim(), benefits:$('s-ben').value, about:$('s-ab').value.trim() };
      this.disabled=true;
      var r=await sb.from('settings').upsert(row);
      if(r.error){ console.error(r.error); $('s-err').textContent='No se pudo guardar. Vuelve a iniciar sesión e intenta de nuevo.'; this.disabled=false; return; }
      closePanel(); toast('Ajustes guardados'); load();
    };
  }

  /* ---------- Inicio ---------- */
  $('q').addEventListener('input',function(e){ ui.q=e.target.value; renderGrid(); });
  $('sort').addEventListener('change',function(e){ ui.sort=e.target.value; renderGrid(); });
  $('cart-btn').onclick=openCart;
  $('admin-link').onclick=openLogin;
  if(location.hash==='#admin') openLogin();
  sb.auth.getSession().then(function(r){ ui.user=r.data.session?r.data.session.user:null; renderAdminBar(); renderGrid(); });
  saveCart();
  load();
})();
</script>
</body>
</html>
